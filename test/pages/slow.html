<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Loading</title></head>
<body>
  <div id="root" aria-busy="true"><p>Loading the page.</p></div>
  <script>
    setTimeout(() => {
      document.getElementById('root').removeAttribute('aria-busy');
      document.getElementById('root').innerHTML = '<h1>Ready</h1><p>The opening time is 09:00.</p><a href="/index.html">Start page</a>';
    }, 400);
  </script>
</body></html>
